<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سناریوی ارائه مدیرعامل | گروه فولادی ستاره عرش</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#102f43;font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif}.app{max-width:1180px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:900}.muted{color:#70848d;font-size:13px}.pill{padding:6px 11px;border-radius:20px;background:#e4f4f5;color:#23727a;font-size:12px}.card{background:#fff;border:1px solid #d8e3e7;border-radius:16px;box-shadow:0 12px 30px #12384d12;padding:24px}.progress{display:flex;gap:6px;margin-bottom:20px}.dot{height:7px;flex:1;border-radius:9px;background:#dfe8eb}.dot.active{background:#00a0a8}.dot.done{background:#d6a24a}.step-title{font-size:25px;margin:0 0 8px;font-weight:900}.step-desc{color:#617681;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{border:1px solid #d8e3e7;border-radius:12px;padding:17px;background:#f8fafb}.metric b{display:block;font-size:24px;margin:7px 0}.warn{color:#a16d18}.danger{color:#b04040}.ok{color:#277451}.table{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}.table th,.table td{text-align:center;padding:12px;border-bottom:1px solid #e1e9ec}.table th{background:#f6f9fa;color:#617681;font-size:12px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px}.badge.warn{background:#fff2d8}.badge.danger{background:#fde7e7}.badge.ok{background:#e4f4ed}.timeline{display:flex;gap:4px;margin:22px 0}.timeline span{flex:1;text-align:center;font-size:11px;color:#71838b;padding-top:12px;border-top:5px solid #dfe8eb}.timeline .done{border-color:#00a0a8}.timeline .current{border-color:#d6a24a}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.btn{border:0;border-radius:9px;padding:11px 18px;background:#102f43;color:#fff;font-size:13px}.btn.secondary{background:#fff;color:#102f43;border:1px solid #cbd9de}.callout{padding:15px;border-radius:11px;background:#fff8ea;border:1px solid #efd498;color:#78591b;margin:15px 0}.audit{border-right:3px solid #00a0a8;padding:9px 14px;margin:10px 0;background:#f7fafb}.owner{display:flex;gap:10px;flex-wrap:wrap}.owner div{padding:11px 14px;border:1px solid #d8e3e7;border-radius:9px;background:#f8fafb;font-size:13px}@media(max-width:700px){.app{padding:16px}.grid{grid-template-columns:1fr}.head{display:block}.pill{display:inline-block;margin-top:10px}.timeline span{font-size:9px}}
</style></head><body><main class="app"><div class="head"><div><div class="brand">گروه فولادی ستاره عرش</div><div class="muted">سناریوی ارائه نسخه عملیاتی سامانه یکپارچه</div></div><span class="pill">داده‌های نمونه • اجرای مرحله‌ای</span></div><div class="progress" id="progress"></div><section class="card" id="screen"></section></main><script>
const steps=[
{t:'۱. هشدار در داشبورد مدیرعامل',d:'مدیرعامل وارد سامانه می‌شود و یک سفارش دارای هشدار را می‌بیند.',h:`<div class="grid"><div class="metric"><span class="muted">سفارش دارای هشدار</span><b>SO-1405-0187</b><span class="badge danger">کمبود رنگ</span></div><div class="metric"><span class="muted">مقدار سفارش</span><b>۸۰ تن</b><span class="muted">فولادسازان شرق</span></div><div class="metric"><span class="muted">اقدام بعدی</span><b class="warn">بررسی برنامه تولید</b><span class="muted">مسئول: برنامه‌ریزی تولید</span></div></div><div class="callout">هشدار مدیریتی: رنگ RAL 9002 برای تولید سفارش، ۲٫۴ تن کمتر از نیاز برنامه است.</div>`},
{t:'۲. علت هشدار سفارش',d:'با کلیک روی سفارش، علت هشدار و اثر آن بر تعهد تحویل مشخص می‌شود.',h:`<table class="table"><tr><th>مورد</th><th>نیاز سفارش</th><th>موجودی قابل مصرف</th><th>کسری</th><th>اثر</th></tr><tr><td>رنگ RAL 9002</td><td>۱۲ تن</td><td>۹٫۶ تن</td><td class="danger">۲٫۴ تن</td><td><span class="badge danger">ریسک تأخیر تولید</span></td></tr></table><div class="owner"><div>مدل فروش: تولید انباری</div><div>موعد تحویل: ۲۱ تیر ۱۴۰۵</div><div>مجوز تغییر برنامه: مدیرعامل</div></div>`},
{t:'۳. تأثیر بر برنامه تولید',d:'مدیرعامل وارد برنامه تولید می‌شود و اثر کمبود بر روز بعد را می‌بیند.',h:`<table class="table"><tr><th>روز</th><th>سفارش</th><th>برنامه اولیه</th><th>برنامه اصلاحی</th><th>علت اصلاح</th></tr><tr><td>شنبه</td><td>SO-1405-0187</td><td>۸۰ تن</td><td class="warn">تعویق ۲۴ ساعت</td><td>کمبود RAL 9002</td></tr><tr><td>یکشنبه</td><td>SO-1405-0191</td><td>۶۰ تن</td><td>۶۰ تن</td><td>بدون تغییر</td></tr></table><div class="callout">پیشنهاد سامانه: خرید فوری رنگ یا جایگزینی اولویت با سفارش دارای مواد آماده.</div>`},
{t:'۴. کویل تخصیص‌یافته و مالکیت',d:'کویل‌های تخصیص‌یافته و سوابق مالکیت آن‌ها بررسی می‌شود.',h:`<div class="grid"><div class="metric"><span class="muted">کویل ورودی</span><b>IN-1405-044</b><span class="ok">مالک: شرکت</span></div><div class="metric"><span class="muted">مشخصات</span><b>۰٫۵ × ۱۲۵۰</b><span class="muted">DX51D • فولاد مبارکه</span></div><div class="metric"><span class="muted">کویل‌های رزرو</span><b>۶ کویل</b><span class="muted">برای SO-1405-0187</span></div></div><table class="table"><tr><th>رویداد</th><th>تاریخ</th><th>مالک</th><th>مرجع</th></tr><tr><td>ورود به کارخانه</td><td>۱۲ تیر</td><td>شرکت</td><td>رسید انبار ۲۳۱۰</td></tr><tr><td>تخصیص به سفارش</td><td>۱۵ تیر</td><td>شرکت</td><td>SO-1405-0187</td></tr></table>`},
{t:'۵. موجودی انبار کویل و رنگ',d:'مدیرعامل موجودی قابل مصرف مواد و محصول را یکجا می‌بیند.',h:`<div class="grid"><div class="metric"><span class="muted">کویل ورق قابل مصرف</span><b>۴۸۵ تن</b><span class="ok">کفایت ۹ روز</span></div><div class="metric"><span class="muted">رنگ RAL 9002</span><b class="danger">۹٫۶ تن</b><span class="danger">کسری ۲٫۴ تن</span></div><div class="metric"><span class="muted">محصول آماده</span><b>۱٬۸۴۰ تن</b><span class="muted">پوشش ۱۲ روز فروش</span></div></div><table class="table"><tr><th>انبار</th><th>قلم</th><th>موجودی</th><th>رزرو</th><th>آزاد</th></tr><tr><td>مواد اولیه</td><td>رنگ RAL 9002</td><td>۹٫۶ تن</td><td>۹٫۶ تن</td><td class="danger">۰</td></tr><tr><td>مواد اولیه</td><td>ورق DX51D</td><td>۴۸۵ تن</td><td>۸۰ تن</td><td>۴۰۵ تن</td></tr></table>`},
{t:'۶. مغایرت باسکول و بررسی دفتر تهران',d:'مغایرت ۱۲۰ کیلوگرمی از حد مجاز ۸۰ کیلوگرم بیشتر است و سوابق بررسی نمایش داده می‌شود.',h:`<table class="table"><tr><th>مرجع وزن</th><th>وزن</th><th>اختلاف</th></tr><tr><td>باسکول فروشنده</td><td>۱۲٬۹۸۰ kg</td><td>—</td></tr><tr><td>منطقه آزاد کاوه</td><td>۱۲٬۸۵۰ kg</td><td>۱۳۰ kg</td></tr><tr><td>ورودی کارخانه</td><td>۱۲٬۸۶۰ kg</td><td class="danger">۱۲۰ kg</td></tr></table><div class="callout"><b>وضعیت: نیازمند تأیید دفتر تهران</b><br>بررسی‌کننده: واحد مالی دفتر تهران • مستند: تصویر قبض باسکول و بارنامه • نتیجه: مغایرت برای تصمیم مدیرعامل ثبت شد.</div>`},
{t:'۷. وضعیت تولید، QC، حمل و وصول',d:'همه وضعیت‌های همان سفارش در یک صفحه مشاهده می‌شود.',h:`<div class="timeline"><span class="done">ثبت سفارش</span><span class="done">تأیید مدیرعامل</span><span class="done">تخصیص موجودی</span><span class="current">در انتظار تولید</span><span>QC</span><span>بارگیری</span><span>تحویل</span><span>تسویه</span></div><div class="grid"><div class="metric"><span class="muted">تولید</span><b class="warn">در انتظار رنگ</b></div><div class="metric"><span class="muted">کنترل کیفیت</span><b>در انتظار تولید</b></div><div class="metric"><span class="muted">وصول</span><b>پیش‌پرداخت ثبت شد</b></div></div>`},
{t:'۸. تاریخچه تغییر برنامه و مجوز',d:'در پایان، مدیرعامل تاریخچه تغییر برنامه و مجوز خود را مشاهده می‌کند.',h:`<div class="audit"><b>۱۰:۰۳ • برنامه‌ریزی تولید</b><br>اولویت SO-1405-0187 به‌دلیل کمبود رنگ تغییر کرد.</div><div class="audit"><b>۱۰:۰۸ • مدیرعامل</b><br>تعویق ۲۴ ساعته برنامه تأیید شد. مجوز دیجیتال ثبت و غیرقابل حذف است.</div><div class="audit"><b>۱۰:۱۲ • دفتر تهران</b><br>مغایرت وزن ۱۲۰ کیلوگرمی برای بررسی نهایی ارجاع شد.</div><div class="callout"><b>سناریو کامل شد.</b> تمام تصمیم‌ها، داده‌ها، هشدارها و مجوزها در یک مرجع قابل رهگیری ثبت شده‌اند.</div>`}];
let i=0;function render(){document.getElementById('progress').innerHTML=steps.map((_,n)=>`<span class="dot ${n<i?'done':''} ${n===i?'active':''}"></span>`).join('');let s=steps[i];document.getElementById('screen').innerHTML=`<h1 class="step-title">${s.t}</h1><p class="step-desc">${s.d}</p>${s.h}<div class="actions"><button class="btn secondary" ${i===0?'disabled':''} onclick="prev()">گام قبل</button><span class="muted">گام ${i+1} از ${steps.length}</span><button class="btn" onclick="next()">${i===steps.length-1?'شروع دوباره':'گام بعد →'}</button></div>`}function next(){i=i===steps.length-1?0:i+1;render()}function prev(){if(i>0)i--;render()}render();</script></body></html>
